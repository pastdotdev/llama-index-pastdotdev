[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.1.1",
    "ruff>=0.11",
]

[project]
name = "llama-index-tools-pastdotdev"
version = "0.1.0"
description = "past dev tools for LlamaIndex agents: recall and ingest with the past dev Memory API"
authors = [{name = "past.dev", email = "louis@past.dev"}]
maintainers = [{name = "past.dev", email = "louis@past.dev"}]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llama-index", "llamaindex", "past dev", "past.dev", "tools", "agent tools", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "llama-index-core>=0.13.0,<0.15",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://past.dev"
Documentation = "https://past.dev/docs/memory-api/quickstart"
"API reference" = "https://past.dev/docs/memory-api/api-reference"
Repository = "https://github.com/pastdotdev/llama-index-pastdotdev"

[tool.hatch.build.targets.sdist]
include = ["llama_index/", "tests/", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.tools.pastdotdev"

[tool.llamahub.class_authors]
PastDevToolSpec = "pastdotdev"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: calls the real past dev API; skipped unless PAST_API_KEY is set"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# The formatter wraps code; long lines left are docstrings, which the model reads.
ignore = ["E501"]
